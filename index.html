<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c131a">
<meta name="description" content="Registro diario del Winter Arc de 180 días">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Winter Arc Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, sticky day header, bottom tab bar (Hoy · Progreso · Plan); ice-blue accent on frost/graphite neutrals */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#e2e8ee; --line:#d0d9e1; --fg:#13202b; --muted:#5a6a79;
  --accent:#1d6cb0; --accent-fg:#ffffff; --accent-soft:#d7e7f5; --good:#1b8556; --good-soft:#d4eee1; --warn:#a8650f; --bad:#bf3737;
  --heat0:#dbe3ea; --heat1:#b5d0e8; --heat2:#6aa3d4; --heat3:#1d6cb0;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c131a; --surface:#142029; --surface-2:#1b2934; --line:#293946; --fg:#e5ecf2; --muted:#93a4b3;
  --accent:#6cb2ea; --accent-fg:#08131c; --accent-soft:#16324a; --good:#4cc38a; --good-soft:#123425; --warn:#e2a04a; --bad:#ef6b6b;
  --heat0:#1b2934; --heat1:#1c4262; --heat2:#2e6ea4; --heat3:#6cb2ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131a; --surface:#142029; --surface-2:#1b2934; --line:#293946; --fg:#e5ecf2; --muted:#93a4b3;
  --accent:#6cb2ea; --accent-fg:#08131c; --accent-soft:#16324a; --good:#4cc38a; --good-soft:#123425; --warn:#e2a04a; --bad:#ef6b6b;
  --heat0:#1b2934; --heat1:#1c4262; --heat2:#2e6ea4; --heat3:#6cb2ea; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));min-height:100svh}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--good)} .status.saving i{background:var(--warn)} .status.err i{background:var(--bad)}
.daynav{display:flex;align-items:center;gap:10px}
.daynav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}
.daynav button:disabled{opacity:.35;cursor:default}
.dayinfo{flex:1;min-width:0}
.dayn{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em}
.dayn small{font-size:18px;color:var(--muted);font-weight:500}
.daydate{color:var(--muted);font-size:13px}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700}
.todaybtn{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.25}

/* sections */
main{display:grid;gap:14px;padding-top:6px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.02em;margin:0;display:flex;align-items:baseline;gap:8px}
.card h2 .side{margin-left:auto;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}

/* habits */
.habits{display:grid;gap:6px}
.habit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:none;border-radius:12px;padding:11px 12px;min-height:48px}
.habit .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:transparent}
.habit.on{border-color:transparent;background:var(--good-soft)}
.habit.on .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.habit .t{flex:1;min-width:0}
.habit .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap}

/* steps */
.bignum{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bignum input{width:150px;font-family:var(--display);font-size:34px;font-weight:700;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:4px 10px;color:var(--fg);font-variant-numeric:tabular-nums}
.bignum .of{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.done span{background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 13px;font-size:13.5px;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}

/* water */
.glasses{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.glass{aspect-ratio:3/4;max-width:100%;border:2px solid var(--line);border-radius:4px 4px 8px 8px;background:none;padding:0}
.glass.on{background:var(--accent);border-color:var(--accent)}

/* meals */
.meals{display:grid;gap:6px}
.meal{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;width:100%;text-align:left;border:1px solid var(--line);background:none;border-radius:12px;padding:10px 12px}
.meal .box{grid-row:span 2;margin-top:2px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700}
.meal.on{background:var(--good-soft);border-color:transparent}
.meal.on .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.meal .mt{font-weight:600;display:flex;gap:8px;align-items:baseline}
.meal .mt span{font-family:var(--display);font-weight:500;color:var(--muted);font-size:15px}
.meal .md{font-size:13px;color:var(--muted);min-width:0}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit}
.field input{font-family:var(--display);font-size:24px;font-weight:600;padding:6px 12px;font-variant-numeric:tabular-nums}
textarea{min-height:76px;resize:vertical}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:none;font-size:20px;flex:none}
.stepper .num{font-size:30px;font-weight:700;min-width:64px;text-align:center}
.crave{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crave button{background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.crave .num{font-size:30px;font-weight:700}

/* progress */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.heatwrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(11px,1fr);gap:3px;min-width:330px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--heat0);border:0;padding:0}
.cell.l1{background:var(--heat1)} .cell.l2{background:var(--heat2)} .cell.l3{background:var(--heat3)}
.cell.fut{background:none;outline:1px dashed var(--line);outline-offset:-1px}
.cell.sel{outline:2px solid var(--fg);outline-offset:0}
.cell.blank{visibility:hidden}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.phases{display:grid;gap:6px}
.phase{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.phase.cur{border-color:var(--accent);background:var(--accent-soft)}
.phase .pn{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);width:22px}
.phase .pt{font-weight:600} .phase .pd{font-size:12.5px;color:var(--muted)}
.phase .pg{font-family:var(--display);font-size:18px;font-weight:600;white-space:nowrap}

/* plan */
.sched{display:grid}
.slot{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .h{font-family:var(--display);font-size:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.now{background:var(--accent-soft);border-radius:10px;padding-inline:10px;margin-inline:-10px;border-top-color:transparent}
.slot.now .h{color:var(--accent)}
.slot.now + .slot{border-top-color:transparent}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs div{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:560px}
nav.tabs button{border:0;background:none;border-radius:12px;padding:10px 4px;font-weight:600;color:var(--muted);font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.stat .v{font-size:22px}.dayn{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <span class="brand">Winter Arc</span>
      <span class="status" id="status"><i></i><span>Cargando…</span></span>
    </div>
    <div class="daynav">
      <button id="prev" aria-label="Día anterior">‹</button>
      <div class="dayinfo">
        <div class="dayn" id="dayn"></div>
        <div class="daydate" id="daydate"></div>
      </div>
      <div class="ring" id="ring" title="Hábitos cumplidos"></div>
      <button id="next" aria-label="Día siguiente">›</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div role="tablist">
  <button role="tab" data-tab="hoy" aria-selected="true">Hoy</button>
  <button role="tab" data-tab="progreso" aria-selected="false">Progreso</button>
  <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
</div></nav>

<script>
(function(){
"use strict";
/* ---------- constants from the Winter Arc plan ---------- */
const START = new Date(2026, 9, 1);           // jueves 1 oct 2026
const TOTAL = 180, START_KG = 100;
const TARGETS = [[1,100],[30,96],[90,90],[150,83],[180,79]];
const PHASES = [
  {n:1,name:"Fundamentos",from:1,to:30,goal:"~96 kg",focus:"Cero cigarrillos y golosinas. Pasos de 7.000 a 10.000. Fuerza 2 veces por semana."},
  {n:2,name:"Consistencia",from:31,to:90,goal:"~90 kg",focus:"10.000 pasos fijos. Fuerza 3 veces (suma el sábado). Comida libre semanal sin golosinas."},
  {n:3,name:"Progresión",from:91,to:150,goal:"~83 kg",focus:"Más peso en la fuerza. Una conversación de inglés por semana. Control con el nutricionista."},
  {n:4,name:"Definición",from:151,to:180,goal:"78-80 kg",focus:"Mantener todo igual. Fotos y medidas finales el 29 de marzo."}
];
const HABITS = [
  {k:"wake", t:"Desperté antes de las 7:00"},
  {k:"smoke",t:"0 cigarrillos"},
  {k:"sugar",t:"0 golosinas"},
  {k:"food", t:"Comí según la tabla"},
  {k:"steps",t:"10.000 pasos", auto:"pasos"},
  {k:"train",t:"Entrené", auto:"entreno"},
  {k:"eng",  t:"30 min de inglés", auto:"inglés"},
  {k:"phone",t:"Celular fuera del cuarto a las 22:00"}
];
const TRAININGS = ["Boxeo","Fuerza A","Fuerza B","Caminata larga","Movilidad","Descanso"];
const DESAY = {
  A:"2 rebanadas de pan integral + 3 huevos revueltos + café con 125 ml de leche descremada + 1 fruta",
  B:"60 g de avena cocida en 125 ml de leche con canela y banana + 3 huevos duros",
  C:"4 galletas de arroz + omelette de 3 huevos con tomate + 100 ml de yogur + 1 fruta"
};
const MENU = { // getDay(): [desayuno, almuerzo, comida principal]
  1:["A","Pollo al horno + 300 g de boniato + bastones de zapallo al horno","100 g de fideos con salsa roja escondida + pollo en tiras"],
  2:["B","150 g de fideos \"boloñesa\" con nalga picada y salsa escondida","100 g de arroz con zanahoria + bola de lomo a la plancha + tomate"],
  3:["C","150 g de arroz con zanahoria + atún al natural + tomate y zanahoria rallada","Albóndigas de carne en salsa roja + 200 g de puré mixto con zapallo"],
  4:["A","Hamburguesas caseras de pollo con zanahoria + 300 g de puré mixto","Pollo a la plancha + 100 g de arroz + zapallo al horno"],
  5:["B","Bola de lomo + 150 g de arroz + crema de zapallo","Atún + 200 g de papa hervida + tomate y zanahoria (ensalada tibia)"],
  6:["C","Milanesa de pollo al horno + 100 g de papa al horno + tomate","Hamburguesa casera de carne en 2 rebanadas de pan + tomate + bastones de zapallo"],
  0:["A","Pollo al horno + 300 g de papa al horno + calabaza asada","Nalga al horno + 200 g de boniato + crema de zapallo"]
};
const PRE = "2 almidones (60 g de avena, 2 rebanadas de pan o 4 galletas de arroz) + 1 fruta";
const POST = "1 scoop de whey + 125 ml de leche descremada (sin whey: 3 huevos revueltos)";
function mealsFor(date){
  const w = date.getDay(), m = MENU[w], weekend = (w===0||w===6);
  const base = [
    {k:"des", t:"Desayuno", h: weekend?"8:00":"7:25", d:DESAY[m[0]]},
    {k:"mm",  t:"Media mañana", h:"11:00", d:"1 fruta"},
    {k:"alm", t:"Almuerzo", h: weekend?"13:30":"13:00", d:m[1]+" · 200 g de verdura · 1 cdita de aceite · 1 fruta"}
  ];
  if (weekend) return base.concat([
    {k:"pre", t:"Merienda", h:"17:00", d:PRE+" + "+POST.replace(" (sin whey: 3 huevos revueltos)","")},
    {k:"com", t:"Cena (comida principal)", h:"20:30", d:m[2]+" · 1 cdita de aceite · 1 fruta"}
  ]);
  return base.concat([
    {k:"com", t:"Comida principal", h:"16:30", d:m[2]+" · 1 cdita de aceite · 1 fruta"},
    {k:"pre", t:"Pre-boxeo", h:"19:00", d:PRE},
    {k:"post",t:"Post-boxeo", h:"21:15", d:POST}
  ]);
}
function scheduleFor(date, n){
  const w = date.getDay();
  if (w===0 || w===6){
    const sat = w===6;
    return [
      ["06:45","07:30","Despertar, agua, lectura y minoxidil"],
      ["08:00","08:30","Desayuno"],
      ["08:30", sat?"09:45":"09:30", sat?"Caminata larga 75 min (~8.000 pasos)":"Caminata larga 60 min o bici"],
      ["10:00", sat?"10:40":"11:30", sat?(n>=31?"Fuerza (rutina A o B)":"Libre (la fuerza del sábado empieza el día 31)"):"Meal prep de la semana"],
      [sat?"11:00":"11:30", "12:00", sat?"Inglés: repaso de la semana":"Revisión semanal (15 min)"],
      ["13:30","14:00","Almuerzo"],
      ["14:00","17:00","Libre: salir, amigos, familia. Sumar pasos caminando"],
      ["17:00","17:30","Merienda + batido"],
      ["17:30","20:30", sat?"Libre":"Libre. Película o serie en inglés"],
      ["20:30","21:00","Cena (comida principal)"],
      ["22:00","22:30","Celular fuera del cuarto"],
      ["22:30","23:59", sat?"A dormir (máximo 23:30)":"A dormir"]
    ];
  }
  const strength = (w===2 || w===4);
  return [
    ["06:45","06:50","Despertar, vaso de agua, tender la cama"],
    ["06:50","07:15","Lectura: Hábitos atómicos"],
    ["07:15","07:25","Minoxidil"],
    ["07:25","07:45","Desayuno"],
    ["07:45","08:15","Inglés: bloque de estudio (30 min)"],
    ["08:15","08:50","Caminata 35 min (~4.000 pasos)"],
    ["08:50","09:25","Vestirse, vianda, margen"],
    ["09:25","09:45","Salir al trabajo (caminar un tramo)"],
    ["09:45","16:00","Trabajo · fruta 11:00 · almuerzo 13:00"],
    ["16:00","16:30","Vuelta a casa"],
    ["16:30","17:00","Comida principal"],
    ["17:00","17:35", strength?"Fuerza 35 min (alternar A y B)":"Movilidad y core 15 min, después tareas"],
    ["17:45","18:15","Caminata 30 min con podcast en inglés"],
    ["18:15","19:00","Libre productivo: tareas, orden, serie en inglés"],
    ["19:00","19:40","Snack pre-boxeo + redes permitidas (40 min, con alarma)"],
    ["19:50","21:00","Boxeo"],
    ["21:00","21:30","Batido post-boxeo + charla con tu amigo"],
    ["21:30","22:00","Ducha y minoxidil"],
    ["22:00","22:30","Celular a cargar fuera del cuarto · leer en papel"],
    ["22:30","23:59","A dormir"]
  ];
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dayNum = d => Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(START.getFullYear(),START.getMonth(),START.getDate()))/864e5)+1;
const dateOfNum = n => new Date(START.getFullYear(), START.getMonth(), START.getDate()+n-1);
const fmtLong = d => { const x = d.toLocaleDateString("es-UY",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); return x.charAt(0).toUpperCase()+x.slice(1); };
const fmtShort = d => d.toLocaleDateString("es-UY",{day:"numeric",month:"short"});
function todayNum(){ return dayNum(new Date()); }
function clampNum(n){ return Math.max(1, Math.min(TOTAL, n)); }

/* ---------- state ---------- */
const days = {};                // key -> record
let tab = "hoy";
let sel = clampNum(todayNum());
let mode = "local", col = null;
const timers = {}, pending = {};
function blank(){ return {h:{}, steps:0, water:0, meals:{}, train:[], eng:0, weight:null, waist:null, cravings:0, note:""}; }
function rec(n){ const k = keyOf(dateOfNum(n)); return days[k] || null; }
function ensure(n){ const k = keyOf(dateOfNum(n)); if(!days[k]) days[k] = blank(); return days[k]; }
function done(r, k){
  if(!r) return false;
  if(k==="steps") return (r.steps||0) >= 10000;
  if(k==="train") return (r.train||[]).some(t => t!=="Descanso");
  if(k==="eng") return (r.eng||0) >= 30;
  return !!(r.h && r.h[k]);
}
function score(r){ return HABITS.reduce((s,h)=> s + (done(r,h.k)?1:0), 0); }

/* ---------- storage ---------- */
const LS = "winterarc.days.v1";
function localLoad(){ try{ const raw = localStorage.getItem(LS); if(raw) Object.assign(days, JSON.parse(raw)); }catch(e){} }
function localSave(){ try{ localStorage.setItem(LS, JSON.stringify(days)); }catch(e){} }
function setStatus(s){
  const el = document.getElementById("status");
  const txt = {ok:"Guardado", saving:"Guardando…", local:"Guardado en este celular", err:"No se pudo guardar. Reintenta", load:"Cargando…"}[s];
  el.className = "status " + (s==="local"?"":s);
  el.lastElementChild.textContent = txt;
}
function save(key){
  localSave();
  clearTimeout(timers[key]);
  if(mode !== "db"){ setStatus("local"); return; }
  setStatus("saving");
  timers[key] = setTimeout(async () => {
    delete timers[key];
    pending[key] = (pending[key]||0) + 1;
    const data = JSON.parse(JSON.stringify(days[key]));
    try{ await col.doc(key).set(data); if(!Object.keys(timers).length) setStatus("ok"); }
    catch(e){ setStatus("err"); }
    finally{ pending[key]--; }
  }, 700);
}
function touch(n){ save(keyOf(dateOfNum(n))); refresh(); }

async function initStore(){
  localLoad();
  render();
  let db = null, user = null, uid = null;
  try{ if(window.claude && window.claude.use){ db = await window.claude.use("db"); user = await window.claude.use("user"); } }catch(e){}
  try{ if(user) uid = await user.id(); }catch(e){}
  if(!db || !uid){ mode = "local"; setStatus("local"); return; }
  try{ col = db.collection("data/users/" + uid); }catch(e){ setStatus("local"); return; }
  mode = "db";
  let first = true;
  col.onSnapshot(snap => {
    const seen = new Set();
    snap.docs.forEach(d => {
      seen.add(d.id);
      if(timers[d.id] || pending[d.id]) return;
      days[d.id] = JSON.parse(JSON.stringify(d.data()));
    });
    if(first){
      first = false;
      // upload anything recorded in this browser before the store was reachable
      Object.keys(days).forEach(k => { if(!seen.has(k)) save(k); });
      if(!Object.keys(timers).length) setStatus("ok");
    }
    localSave();
    const a = document.activeElement;
    if(a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA")) { refresh(); return; }
    render();
  }, () => { mode = "local"; setStatus("local"); });
}

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="text") el.textContent = v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs){ const el = document.createElementNS(svgNS, tag); for(const [k,v] of Object.entries(attrs||{})) el.setAttribute(k,v); return el; }
const fmtInt = n => (n||0).toLocaleString("es-UY");
const fmtKg = n => n==null ? "—" : Number(n).toLocaleString("es-UY",{minimumFractionDigits:1,maximumFractionDigits:1});

function targetAt(n){
  for(let i=1;i<TARGETS.length;i++){ const [a,ka]=TARGETS[i-1],[b,kb]=TARGETS[i]; if(n<=b) return ka + (kb-ka)*(n-a)/(b-a); }
  return 79;
}
function weights(){
  const out = [];
  for(let n=1;n<=TOTAL;n++){ const r = rec(n); if(r && r.weight) out.push([n, Number(r.weight)]); }
  return out;
}
function lastWeight(upto){ let w=null; weights().forEach(([n,kg])=>{ if(n<=upto) w=kg; }); return w; }
function streak(test){
  let n = clampNum(todayNum()); if(todayNum() < 1) return 0;
  if(!test(rec(n))) n--;
  let c = 0; while(n>=1 && test(rec(n))){ c++; n--; }
  return c;
}

/* ---------- header ---------- */
function renderHeader(){
  const d = dateOfNum(sel), t = todayNum();
  const dn = document.getElementById("dayn");
  dn.textContent = "";
  dn.append("Día " + sel, h("small",null," / " + TOTAL));
  const dd = document.getElementById("daydate");
  dd.textContent = fmtLong(d);
  if(sel !== clampNum(t) && t>=1 && t<=TOTAL){
    dd.append(" ", h("button",{class:"todaybtn", onclick:()=>{ sel = clampNum(t); render(); }}, "Ir a hoy"));
  }
  document.getElementById("prev").disabled = sel<=1;
  document.getElementById("next").disabled = sel>=TOTAL;
  refreshRing();
  refreshStats();
}
function refreshRing(){
  const sc = score(rec(sel)), C = 2*Math.PI*24;
  const ring = document.getElementById("ring");
  ring.textContent = "";
  const sv = s("svg",{viewBox:"0 0 58 58","aria-hidden":"true"});
  sv.append(s("circle",{cx:29,cy:29,r:24,fill:"none",stroke:"var(--surface-2)","stroke-width":6}));
  sv.append(s("circle",{cx:29,cy:29,r:24,fill:"none",stroke: sc===8?"var(--good)":"var(--accent)","stroke-width":6,"stroke-linecap":"round","stroke-dasharray":C,"stroke-dashoffset":C*(1-sc/8)}));
  ring.append(sv, h("b",null, sc + "/8"));
  ring.setAttribute("aria-label", sc + " de 8 hábitos");
}
function refreshStats(){
  const t = clampNum(todayNum());
  const smoke = todayNum()<1 ? 0 : streak(r => done(r,"smoke"));
  const w = lastWeight(t);
  const good = todayNum()<1 ? 0 : streak(r => score(r) >= 6);
  const st = document.getElementById("stats");
  st.textContent = "";
  st.append(
    h("div",{class:"stat"}, h("div",{class:"v"}, String(smoke)), h("div",{class:"l"}, "días seguidos sin fumar")),
    h("div",{class:"stat"}, h("div",{class:"v"}, w==null? "100" : fmtKg(w)), h("div",{class:"l"}, w==null ? "kg · peso inicial" : (w<=START_KG ? "kg · −"+fmtKg(START_KG-w)+" desde el inicio" : "kg · +"+fmtKg(w-START_KG)))),
    h("div",{class:"stat"}, h("div",{class:"v"}, String(good)), h("div",{class:"l"}, "días seguidos con 6/8 o más"))
  );
}

function refreshHoy(){
  const r = rec(sel);
  const hab = document.getElementById("habits"); if(!hab) return;
  hab.textContent = "";
  HABITS.forEach(x => {
    const on = done(r, x.k);
    hab.append(h("button",{class:"habit"+(on?" on":""),"aria-pressed":on?"true":"false",onclick:()=>{
      if(x.auto){ const id = {pasos:"sec-pasos",entreno:"sec-entreno","inglés":"sec-ingles"}[x.auto]; document.getElementById(id).scrollIntoView({behavior:"smooth",block:"center"}); return; }
      const rr = ensure(sel); rr.h = rr.h||{}; rr.h[x.k] = !rr.h[x.k]; touch(sel);
    }}, h("span",{class:"box"},"✓"), h("span",{class:"t"}, x.t), x.auto ? h("span",{class:"tag"},"auto") : null));
  });
  const sc = score(r);
  document.getElementById("habside").textContent = sc + " de 8";
  const st = (r&&r.steps)||0;
  const bar = document.getElementById("stepbar");
  bar.firstChild.style.width = Math.min(100, st/100) + "%";
  bar.classList.toggle("done", st>=10000);
  document.getElementById("stepside").textContent = st>=10000 ? "meta cumplida" : "faltan " + fmtInt(10000-st);
}

/* ---------- PROGRESO ---------- */
function renderProgreso(main){
  const t = clampNum(Math.max(1, todayNum()));

  // weight chart
  const W=600,H=280,L=50,R=16,T=20,B=40, lo=75, hi=102;
  const X = n => L + (n-1)/(TOTAL-1)*(W-L-R), Y = kg => T + (hi-kg)/(hi-lo)*(H-T-B);
  const sv = s("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Peso real contra la meta"});
  [80,85,90,95,100].forEach(k => {
    sv.append(s("line",{x1:L,x2:W-R,y1:Y(k),y2:Y(k),stroke:"var(--line)","stroke-width":1}));
    const tx = s("text",{x:L-8,y:Y(k)+4,"text-anchor":"end","font-size":18,fill:"var(--muted)","font-family":"Figtree, sans-serif"}); tx.textContent = k; sv.append(tx);
  });

  });
  sv.append(s("polyline",{points:TARGETS.map(([n,k])=>X(n)+","+Y(k)).join(" "),fill:"none",stroke:"var(--muted)","stroke-width":1.5,"stroke-dasharray":"6 5"}));
  const ws = [[1,START_KG]].concat(weights().filter(([n])=>n>1));
  if(ws.length>1){
    const area = "M"+X(ws[0][0])+","+Y(ws[0][1]) + ws.slice(1).map(([n,k])=>" L"+X(n)+","+Y(k)).join("") + " L"+X(ws[ws.length-1][0])+","+(H-B)+" L"+X(ws[0][0])+","+(H-B)+" Z";
    sv.append(s("path",{d:area,fill:"var(--accent)","fill-opacity":0.1}));

  }

  const lw = ws[ws.length-1];

  const goal = targetAt(t), cur = lastWeight(t);

    h("p",{class:"hint"}, cur==null ? "Anota tu peso los lunes en la pestaña Hoy y aparece aquí." :

  }
  main.append(h("section",{class:"card"},

    h("div",{class:"legend"}, h("span",null,"Hábitos del día:"), h("span",null,h("i",{style:"background:var(--heat1);height:10px;width:10px"}),"1–3"), h("span",null,h("i",{style:"background:var(--heat2);height:10px;width:10px"}),"4–6"), h("span",null,h("i",{style:"background:var(--heat3);height:10px;width:10px"}),"7–8")),

    h("span",{class:"pg"}, p.goal))));

  });
  main.append(h("section",{class:"card"},
    h("h2",null,"Horario", h("span",{class:"side"}, d.toLocaleDateString("es-UY",{weekday:"long",day:"numeric",month:"short"}))),
    list,
    (d.getDay()>0 && d.getDay()<6) ? h("p",{class:"hint"},"Si te levantas a las 7:30: saltea la caminata de la mañana y la de la tarde pasa a 50 minutos. El inglés no se saltea.") : null
  ));

  const fuerza = [
    ["Piernas 1","Sentadilla goblet, 3 × 10–12","Zancada hacia atrás, 3 × 8–10 por pierna"],
    ["Empuje","Flexiones, 3 × 8–12","Press de pecho con mancuernas en el piso, 3 × 10–12"],
    ["Tirón","Remo a una mano, 3 × 10–12 por lado","Face pull con banda, 3 × 15"],
    ["Piernas 2","Peso muerto rumano, 3 × 10–12","Puente de glúteo con mancuerna, 3 × 12–15"],
    ["Core","Plancha, 3 × 30–45 s","Pallof press con banda, 3 × 10 por lado"],
    ["Extra","Dead bug, 2 × 10","Farmer walk, 3 × 30 m"]
  ];
  main.append(h("section",{class:"card"},
    h("h2",null,"Fuerza (35 min)", h("span",{class:"side"},"mar y jue · sáb desde el día 31")),
    h("div",{class:"tablewrap"}, h("table",null,
      h("thead",null,h("tr",null,h("th",null,"Ejercicio"),h("th",null,"Rutina A"),h("th",null,"Rutina B"))),
      h("tbody",null, fuerza.map(f => h("tr",null, h("td",null,f[0]), h("td",null,f[1]), h("td",null,f[2]))))
    )),
    h("p",{class:"hint"},"Deja 2 repeticiones en el tanque. Si llegas al tope en todas las series, sube el peso o usa una banda más dura.")
  ));

  main.append(h("section",{class:"card"},
    h("h2",null,"Reglas no negociables"),
    h("ol",{class:"rules"},
      h("li",null,"Cero cigarrillos, sin \"uno solo\"."),
      h("li",null,"Cero golosinas en casa. Lo dulce viene de la fruta."),
      h("li",null,"Despertador a las 6:45, también el fin de semana (máximo 7:30)."),
      h("li",null,"10.000 pasos todos los días."),
      h("li",null,"Comer lo que dice la tabla del nutricionista."),
      h("li",null,"Celular fuera del dormitorio a las 22:00.")
    ),
    h("p",{class:"hint"},"Si fallas un día, nunca falles dos seguidos.")
  ));

  const fileIn = h("input",{type:"file",accept:"application/json,.json",id:"importfile",hidden:true,onchange:importData});
  const msg = h("p",{class:"hint",id:"datamsg"}, "Tus datos se guardan en este celular. Haz una copia cada domingo, después de la revisión semanal.");
  main.append(h("section",{class:"card"},
    h("h2",null,"Copia de seguridad", h("span",{class:"side"}, Object.keys(days).length + " días anotados")),
    h("div",{class:"actions"},
      h("button",{class:"btn primary",onclick:exportData},"Descargar copia"),
      h("button",{class:"btn",onclick:()=>fileIn.click()},"Restaurar copia")),
    fileIn, msg
  ));
}
function exportData(){
  const blob = new Blob([JSON.stringify({app:"winter-arc",version:1,exported:new Date().toISOString(),days},null,1)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "winter-arc-" + keyOf(new Date()) + ".json";
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importData(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const out = document.getElementById("datamsg");
    try{
      const j = JSON.parse(rd.result), src = j.days || j;
      let c = 0;
      for(const [k,v] of Object.entries(src)){ if(/^\d{4}-\d{2}-\d{2}$/.test(k) && v && typeof v==="object"){ days[k]=v; c++; } }
      if(!c) throw new Error("vacío");
      localSave(); render();
      document.getElementById("datamsg").textContent = "Copia restaurada: " + c + " días.";
    }catch(err){ if(out) out.textContent = "Ese archivo no es una copia del Winter Arc. Elige el .json que descargaste con \"Descargar copia\"."; }
  };
  rd.readAsText(f);
}

/* ---------- render ---------- */
function render(){
  renderHeader();
  const main = document.getElementById("main");
  main.textContent = "";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===tab ? "true":"false"));
  if(tab==="hoy") renderHoy(main);
  else if(tab==="progreso") renderProgreso(main);
  else renderPlan(main);
}
function refresh(){ refreshRing(); refreshStats(); if(tab==="hoy") refreshHoy(); }

document.getElementById("prev").addEventListener("click", ()=>{ if(sel>1){ sel--; render(); } });
document.getElementById("next").addEventListener("click", ()=>{ if(sel<TOTAL){ sel++; render(); } });
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", ()=>{ tab = b.dataset.tab; render(); window.scrollTo({top:0}); }));

initStore();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
</script>
